<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warehouse - Dashboard</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">Warehouse Gudang</div>
      <div class="muted" id="who">Halo</div>
    </div>
    <div class="row gap">
      <button class="btn" type="button" id="btnWarehouse">Warehouse</button>
      <button class="btn" type="button" id="btnOther">Data Lain</button>
      <button class="btn danger" type="button" id="btnLogout">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="grid">
      <div class="panel">
        <h2 class="panel-title">Dashboard</h2>
        <p class="muted">Klik menu di atas untuk berpindah halaman.</p>
        <div class="divider-sm"></div>
        <div class="stack">
          <a class="link-card" href="./warehouse.html" id="linkWarehouse">
            <div>
              <div class="link-title">📦 Warehouse / Barang</div>
              <div class="muted">Tambah, lihat, edit, hapus data barang</div>
            </div>
            <div class="chev">→</div>
          </a>
          <a class="link-card" href="./data-lain.html" id="linkOther">
            <div>
              <div class="link-title">🗂️ Data Lain</div>
              <div class="muted">Tabel sederhana / catatan</div>
            </div>
            <div class="chev">→</div>
          </a>
        </div>
      </div>

      <div class="panel">
        <h2 class="panel-title">Status</h2>
        <div class="kv">
          <div><span class="k">Sesi:</span> <span class="v" id="sessionStatus">-</span></div>
          <div><span class="k">Data barang:</span> <span class="v" id="barangCount">0</span></div>
        </div>
        <div class="divider-sm"></div>
        <p class="small muted">
          Catatan: semua data disimpan di <b>localStorage</b> untuk testing.
        </p>
      </div>
    </section>
  </main>

  <script src="./assets/app.js"></script>
  <script>
    (function () {
      const who = document.getElementById('who');
      const sessionStatus = document.getElementById('sessionStatus');
      const barangCount = document.getElementById('barangCount');

      const user = getAuthUser();
      if (!user) return redirectToLogin();

      who.textContent = 'Halo, ' + user.username;
      sessionStatus.textContent = 'aktif';

      // Hitung jumlah barang (opsional)
      const items = loadBarang();
      barangCount.textContent = String(items.length);

      document.getElementById('btnLogout').addEventListener('click', () => {
        logout();
      });
      document.getElementById('btnWarehouse').addEventListener('click', () => {
        window.location.href = './warehouse.html';
      });
      document.getElementById('btnOther').addEventListener('click', () => {
        window.location.href = './data-lain.html';
      });

      // Pastikan link juga aman
      document.getElementById('linkWarehouse').addEventListener('click', (e) => {
        if (!getAuthToken()) { e.preventDefault(); redirectToLogin(); }
      });
      document.getElementById('linkOther').addEventListener('click', (e) => {
        if (!getAuthToken()) { e.preventDefault(); redirectToLogin(); }
      });
    })();
  </script>
</body>
</html>
