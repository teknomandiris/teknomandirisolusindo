<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warehouse - Data Lain</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">Warehouse Gudang</div>
      <div class="muted" id="who">Halo</div>
    </div>
    <div class="row gap">
      <a class="btn" href="./dashboard.html">← Dashboard</a>
      <button class="btn danger" type="button" id="btnLogout">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="grid2">
      <div class="panel">
        <h2 class="panel-title">Catatan / Data Lain</h2>
        <form id="otherForm" class="stack">
          <input type="hidden" id="id" />

          <label class="field">
            <span>Judul</span>
            <input id="judul" type="text" required placeholder="misal: Pengiriman" />
          </label>

          <label class="field">
            <span>Isi</span>
            <textarea id="isi" rows="6" required placeholder="Tuliskan data lain di sini..."></textarea>
          </label>

          <div class="row">
            <button class="btn primary" type="submit" id="btnSubmit">Tambah</button>
            <button class="btn" type="button" id="btnReset">Batal</button>
          </div>

          <div id="msg" class="msg" role="status" aria-live="polite"></div>
        </form>
      </div>

      <div class="panel">
        <h2 class="panel-title">Daftar Data</h2>

        <div class="row wrap gap">
          <input id="search" class="input" type="text" placeholder="Cari judul" />
          <button class="btn" type="button" id="btnClearSearch">Clear</button>
          <button class="btn danger" type="button" id="btnClearAll">Hapus Semua</button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Judul</th>
                <th>Isi Ringkas</th>
                <th>Waktu</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

        <p class="small muted">Contoh modul tambahan, tetap disimpan di localStorage.</p>
      </div>
    </section>
  </main>

  <script src="./assets/app.js"></script>
  <script>
    (function () {
      const who = document.getElementById('who');
      const user = getAuthUser();
      if (!user) return redirectToLogin();
      who.textContent = 'Halo, ' + user.username;
      document.getElementById('btnLogout').addEventListener('click', logout);

      const form = document.getElementById('otherForm');
      const msg = document.getElementById('msg');
      const idEl = document.getElementById('id');
      const judulEl = document.getElementById('judul');
      const isiEl = document.getElementById('isi');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnReset = document.getElementById('btnReset');

      const tbody = document.getElementById('tbody');
      const searchEl = document.getElementById('search');
      const btnClearSearch = document.getElementById('btnClearSearch');
      const btnClearAll = document.getElementById('btnClearAll');

      let mode = 'create';

      function setMsg(text, type) {
        msg.textContent = text || '';
        msg.className = 'msg ' + (type ? 'msg-' + type : '');
      }

      function escapeHtml(s) {
        return (s == null ? '' : String(s))
          .replaceAll('&','&amp;')
          .replaceAll('<','<')
          .replaceAll('>','>')
          .replaceAll('"','"')
          .replaceAll("'",'&#039;');
      }

      function render() {
        const q = (searchEl.value || '').toLowerCase().trim();
        const items = loadDataLain();
        const filtered = q
          ? items.filter(x => (x.judul || '').toLowerCase().includes(q))
          : items;

        tbody.innerHTML = '';
        if (filtered.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="4" class="muted">Tidak ada data.</td>`;
          tbody.appendChild(tr);
          return;
        }

        for (const it of filtered) {
          const tr = document.createElement('tr');
          const isiRingkas = (it.isi || '').slice(0, 60) + ((it.isi || '').length > 60 ? '...' : '');
          const waktu = new Date(it.createdAt || Date.now()).toLocaleString('id-ID');

          tr.innerHTML = `
            <td>${escapeHtml(it.judul)}</td>
            <td>${escapeHtml(isiRingkas)}</td>
            <td>${escapeHtml(waktu)}</td>
            <td>
              <div class="row gap small-actions">
                <button class="btn small" type="button" data-action="edit" data-id="${it.id}">Edit</button>
                <button class="btn small danger" type="button" data-action="del" data-id="${it.id}">Hapus</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        }

        tbody.querySelectorAll('button[data-action="edit"]').forEach(btn => {
          btn.addEventListener('click', () => startEdit(btn.getAttribute('data-id')));
        });
        tbody.querySelectorAll('button[data-action="del"]').forEach(btn => {
          btn.addEventListener('click', () => doDelete(btn.getAttribute('data-id')));
        });
      }

      function resetForm() {
        mode = 'create';
        idEl.value = '';
        judulEl.value = '';
        isiEl.value = '';
        btnSubmit.textContent = 'Tambah';
        setMsg('', '');
      }

      function startEdit(id) {
        const items = loadDataLain();
        const item = items.find(x => String(x.id) === String(id));
        if (!item) return;

        mode = 'edit';
        idEl.value = item.id;
        judulEl.value = item.judul;
        isiEl.value = item.isi;
        btnSubmit.textContent = 'Simpan Perubahan';
        setMsg('Mode edit aktif.', 'info');
      }

      function doDelete(id) {
        const items = loadDataLain();
        const next = items.filter(x => String(x.id) !== String(id));
        saveDataLain(next);
        setMsg('Data berhasil dihapus.', 'success');
        render();
        if (mode === 'edit' && String(idEl.value) === String(id)) resetForm();
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        setMsg('', '');

        const judul = judulEl.value.trim();
        const isi = isiEl.value.trim();

        if (!judul || !isi) {
          setMsg('Lengkapi judul dan isi.', 'error');
          return;
        }

        const items = loadDataLain();
        if (mode === 'create') {
          items.push({
            id: 'o_' + Math.random().toString(16).slice(2),
            judul,
            isi,
            createdAt: Date.now()
          });
          saveDataLain(items);
          setMsg('Data berhasil ditambahkan.', 'success');
          resetForm();
          render();
        } else {
          const id = idEl.value;
          const idx = items.findIndex(x => String(x.id) === String(id));
          if (idx === -1) {
            setMsg('Data tidak ditemukan untuk edit.', 'error');
            return;
          }
          items[idx] = { ...items[idx], judul, isi, updatedAt: Date.now() };
          saveDataLain(items);
          setMsg('Perubahan tersimpan.', 'success');
          resetForm();
          render();
        }
      });

      btnReset.addEventListener('click', resetForm);
      searchEl.addEventListener('input', render);
      btnClearSearch.addEventListener('click', () => {
        searchEl.value = '';
        render();
      });

      btnClearAll.addEventListener('click', () => {
        const ok = confirm('Yakin hapus semua data?');
        if (!ok) return;
        saveDataLain([]);
        resetForm();
        setMsg('Semua data terhapus.', 'success');
        render();
      });

      render();
      resetForm();
    })();
  </script>
</body>
</html>
