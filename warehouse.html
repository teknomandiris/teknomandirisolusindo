<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warehouse - Barang</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">Warehouse Gudang</div>
      <div class="muted" id="who">Halo</div>
    </div>
    <div class="row gap">
      <a class="btn" href="./dashboard.html">← Dashboard</a>
      <button class="btn danger" type="button" id="btnLogout">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="grid2">
      <div class="panel">
        <h2 class="panel-title">Form Barang</h2>
        <form id="barangForm" class="stack">
          <input type="hidden" id="id" />

          <label class="field">
            <span>Kode Barang</span>
            <input id="kode" type="text" required placeholder="misal: BRG-001" />
          </label>

          <label class="field">
            <span>Nama Barang</span>
            <input id="nama" type="text" required placeholder="misal: Obat A" />
          </label>

          <label class="field">
            <span>Kategori</span>
            <input id="kategori" type="text" required placeholder="misal: Obat" />
          </label>

          <label class="field">
            <span>Stok</span>
            <input id="stok" type="number" min="0" required placeholder="misal: 100" />
          </label>

          <label class="field">
            <span>Lokasi</span>
            <input id="lokasi" type="text" required placeholder="misal: Rak 1" />
          </label>

          <div class="row">
            <button class="btn primary" type="submit" id="btnSubmit">Tambah</button>
            <button class="btn" type="button" id="btnReset">Batal</button>
          </div>

          <div id="msg" class="msg" role="status" aria-live="polite"></div>
        </form>
      </div>

      <div class="panel">
        <h2 class="panel-title">Daftar Barang</h2>
        <div class="row wrap gap">
          <input id="search" class="input" type="text" placeholder="Cari kode / nama / kategori" />
          <button class="btn" type="button" id="btnClearSearch">Clear</button>
          <button class="btn danger" type="button" id="btnClearAll">Hapus Semua</button>
        </div>

        <div class="table-wrap">
          <table class="table" role="table">
            <thead>
              <tr>
                <th>Kode</th>
                <th>Nama</th>
                <th>Kategori</th>
                <th>Stok</th>
                <th>Lokasi</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <!-- rows -->
            </tbody>
          </table>
        </div>

        <p class="small muted">Tip: klik tombol Edit pada baris untuk mengisi form.</p>
      </div>
    </section>
  </main>

  <script src="./assets/app.js"></script>
  <script>
    (function () {
      const who = document.getElementById('who');
      const user = getAuthUser();
      if (!user) return redirectToLogin();
      who.textContent = 'Halo, ' + user.username;

      document.getElementById('btnLogout').addEventListener('click', logout);

      const form = document.getElementById('barangForm');
      // escapeHtml disediakan oleh assets/app.js
      const msg = document.getElementById('msg');
      const idEl = document.getElementById('id');
      const kodeEl = document.getElementById('kode');
      const namaEl = document.getElementById('nama');
      const kategoriEl = document.getElementById('kategori');
      const stokEl = document.getElementById('stok');
      const lokasiEl = document.getElementById('lokasi');

      const tbody = document.getElementById('tbody');
      const searchEl = document.getElementById('search');

      const btnSubmit = document.getElementById('btnSubmit');
      const btnReset = document.getElementById('btnReset');
      const btnClearSearch = document.getElementById('btnClearSearch');
      const btnClearAll = document.getElementById('btnClearAll');

      let mode = 'create';

      function setMsg(text, type) {
        msg.textContent = text || '';
        msg.className = 'msg ' + (type ? 'msg-' + type : '');
      }

      function render() {
        const q = (searchEl.value || '').toLowerCase().trim();
        const items = loadBarang();

        const filtered = q
          ? items.filter(x =>
              (x.kode + ' ' + x.nama + ' ' + x.kategori).toLowerCase().includes(q)
            )
          : items;

        tbody.innerHTML = '';
        if (filtered.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="6" class="muted">Tidak ada data.</td>`;
          tbody.appendChild(tr);
          return;
        }

        for (const it of filtered) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${escapeHtml(it.kode)}</td>
            <td>${escapeHtml(it.nama)}</td>
            <td>${escapeHtml(it.kategori)}</td>
            <td>${it.stok}</td>
            <td>${escapeHtml(it.lokasi)}</td>
            <td>
              <div class="row gap small-actions">
                <button class="btn small" type="button" data-action="edit" data-id="${it.id}">Edit</button>
                <button class="btn small danger" type="button" data-action="del" data-id="${it.id}">Hapus</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        }

        // bind aksi
        tbody.querySelectorAll('button[data-action="edit"]').forEach(btn => {
          btn.addEventListener('click', () => startEdit(btn.getAttribute('data-id')));
        });
        tbody.querySelectorAll('button[data-action="del"]').forEach(btn => {
          btn.addEventListener('click', () => doDelete(btn.getAttribute('data-id')));
        });
      }

      function resetForm() {
        mode = 'create';
        idEl.value = '';
        kodeEl.value = '';
        namaEl.value = '';
        kategoriEl.value = '';
        stokEl.value = '';
        lokasiEl.value = '';
        btnSubmit.textContent = 'Tambah';
        setMsg('', '');
      }

      function startEdit(id) {
        const items = loadBarang();
        const item = items.find(x => String(x.id) === String(id));
        if (!item) return;

        mode = 'edit';
        idEl.value = item.id;
        kodeEl.value = item.kode;
        namaEl.value = item.nama;
        kategoriEl.value = item.kategori;
        stokEl.value = item.stok;
        lokasiEl.value = item.lokasi;
        btnSubmit.textContent = 'Simpan Perubahan';
        setMsg('Mode edit aktif. Setelah simpan, data akan diperbarui.', 'info');
      }

      function doDelete(id) {
        const items = loadBarang();
        const next = items.filter(x => String(x.id) !== String(id));
        saveBarang(next);
        setMsg('Data berhasil dihapus.', 'success');
        render();
        if (mode === 'edit' && String(idEl.value) === String(id)) resetForm();
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        setMsg('', '');

        const kode = kodeEl.value.trim();
        const nama = namaEl.value.trim();
        const kategori = kategoriEl.value.trim();
        const stok = Number(stokEl.value);
        const lokasi = lokasiEl.value.trim();

        if (!kode || !nama || !kategori || !Number.isFinite(stok) || stok < 0 || !lokasi) {
          setMsg('Lengkapi semua field dengan benar.', 'error');
          return;
        }

        const items = loadBarang();

        if (mode === 'create') {
          // cek kode unik (opsional)
          const exists = items.some(x => x.kode.toLowerCase() === kode.toLowerCase());
          if (exists) {
            setMsg('Kode barang sudah ada. Gunakan kode lain.', 'error');
            return;
          }

          const item = {
            id: 'b_' + Math.random().toString(16).slice(2),
            kode,
            nama,
            kategori,
            stok,
            lokasi,
            createdAt: Date.now()
          };
          items.push(item);
          saveBarang(items);
          setMsg('Barang berhasil ditambahkan.', 'success');
          resetForm();
          render();
        } else {
          const id = idEl.value;
          const idx = items.findIndex(x => String(x.id) === String(id));
          if (idx === -1) {
            setMsg('Data tidak ditemukan untuk edit.', 'error');
            return;
          }

          // cek kode unik jika berubah
          const kodeUsedByOther = items.some(x => String(x.id) !== String(id) && x.kode.toLowerCase() === kode.toLowerCase());
          if (kodeUsedByOther) {
            setMsg('Kode barang sudah dipakai data lain.', 'error');
            return;
          }

          items[idx] = {
            ...items[idx],
            kode,
            nama,
            kategori,
            stok,
            lokasi,
            updatedAt: Date.now()
          };
          saveBarang(items);
          setMsg('Perubahan tersimpan.', 'success');
          resetForm();
          render();
        }
      });

      btnReset.addEventListener('click', resetForm);
      searchEl.addEventListener('input', render);
      btnClearSearch.addEventListener('click', () => {
        searchEl.value = '';
        render();
      });

      btnClearAll.addEventListener('click', () => {
        const ok = confirm('Yakin hapus semua data barang?');
        if (!ok) return;
        saveBarang([]);
        resetForm();
        setMsg('Semua data barang terhapus.', 'success');
        render();
      });

      render();
      resetForm();
    })();
  </script>
</body>
</html>
